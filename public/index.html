<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<!-- No inline script, and nothing fetched off this origin except the fonts blue-bar.css imports,
     which is why style-src and font-src name Google Fonts and nothing else does. This page has no
     write side, so what it protects is only that a registry entry never becomes markup. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; img-src 'self'; base-uri 'none'"/>
<title>DVB-I Service List Registry</title>
<link rel="stylesheet" href="blue-bar.css"/>
<style>
  :root {
    color-scheme: light dark;
    --brand: rgb(0,160,210);
    --line: #dfe3e8;
    --muted: #5f6b76;
    --bg: #f4f6f8;
    --card: #ffffff;
    --font: 'Ubuntu', system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --line:#2b3238; --muted:#9aa4ae; --bg:#15181b; --card:#1c2024; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); font-family:var(--font); font-size:14px; line-height:1.55; }
  main { max-width: 68rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:1.1rem 1.25rem; margin-bottom:1.1rem; }
  .card > h2 { margin:0 0 .2rem; font-size:1rem; font-weight:600; }
  .card > .hint { margin:0 0 .9rem; color:var(--muted); font-size:.88rem; }

  .stats { display:flex; gap:.9rem; flex-wrap:wrap; margin-bottom:1.1rem; }
  .stat { flex:1 1 9rem; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:.9rem 1rem; }
  .stat .n { font-size:1.6rem; font-weight:700; color:var(--brand); line-height:1.1; }
  .stat .l { color:var(--muted); font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; }

  table { border-collapse:collapse; width:100%; }
  th,td { text-align:left; padding:.5rem .65rem; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; }
  tr:last-child td { border-bottom:none; }

  code,pre { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  pre { background:rgba(127,127,127,.09); border:1px solid var(--line); border-radius:8px;
        padding:.85rem; overflow-x:auto; max-height:22rem; font-size:.82rem; margin:0; }

  .q { display:flex; gap:.75rem; flex-wrap:wrap; align-items:flex-end; margin-bottom:.75rem; }
  .q label { display:flex; flex-direction:column; gap:.25rem; font-size:.75rem; color:var(--muted);
             text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  .q input, .q select { font:inherit; font-size:.88rem; text-transform:none; letter-spacing:normal;
             padding:.4rem .55rem; border:1px solid var(--line); border-radius:7px;
             background:var(--card); color:inherit; min-width:9rem; }
  .q input:focus, .q select:focus { outline:2px solid var(--brand); outline-offset:-1px; }
  button { font:inherit; font-size:.88rem; font-weight:600; padding:.45rem 1.1rem;
           border:1px solid var(--brand); border-radius:7px; background:var(--brand);
           color:#fff; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  .url-line { margin:0 0 .6rem; font-size:.8rem; color:var(--muted); word-break:break-all; }

  .tag { display:inline-block; background:var(--brand); color:#fff; border-radius:4px;
         padding:0 .4rem; font-size:.72rem; font-weight:600; margin-left:.35rem; }
  /* A local, non-DVB extension. Outlined rather than filled, and in a different colour from the
     brand tag, so it never reads as part of the specified offering data. */
  .tag-ext { background:transparent; color:#b45309; border:1px dashed #b45309; }
  .url { color:var(--muted); font-size:.82rem; font-family:ui-monospace,monospace; }
</style>
</head>
<body>

<header class="blue-bar">
  <div class="blue-bar-logo"><img src="5gmag.png" alt="5G-MAG logo"></div>
  <div class="blue-bar-title">DVB-I Service List Registry</div>
  <div class="blue-bar-actions">
    <a class="blue-bar-link" href="/query" target="_blank" rel="noopener noreferrer">Raw response ↗</a>
  </div>
</header>

<main>
  <div class="stats">
    <div class="stat"><div class="n" id="n-lists">–</div><div class="l">Service lists</div></div>
    <div class="stat"><div class="n" id="n-providers">–</div><div class="l">Providers</div></div>
    <div class="stat"><div class="n" id="n-countries">–</div><div class="l">Countries covered</div></div>
  </div>

  <div class="card">
    <h2>What this registry offers</h2>
    <p class="hint" id="sub">Loading…</p>
    <table>
      <thead><tr><th>Service list</th><th>Provider</th><th>Countries</th><th>Delivery</th><th>Extensions</th><th>URL</th></tr></thead>
      <tbody id="offerings"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Query</h2>
    <p class="hint" id="params">Loading…</p>
    <form class="q" id="q">
      <label>Country<input id="f-country" type="text" placeholder="CHE, DEU" autocomplete="off" spellcheck="false"/></label>
      <label>Delivery<select id="f-delivery"></select></label>
      <label>Provider<input id="f-provider" type="text" placeholder="any" autocomplete="off" spellcheck="false"/></label>
      <label>Regulator list<select id="f-regulator">
        <option value="">any</option><option value="true">only</option><option value="false">exclude</option>
      </select></label>
      <button type="submit">Run</button>
    </form>
    <div class="url-line"><code id="q-url">/query</code></div>
    <pre id="out">Run a query to see the response.</pre>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
